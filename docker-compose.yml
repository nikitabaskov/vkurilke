services:
  app:
    build: .
    restart: unless-stopped
    # The image drops privileges itself when started as root; Compose keeps all
    # capabilities dropped, so run as the unprivileged user from the start.
    user: "10001:10001"
    env_file: .env
    environment:
      PORT: "8080"
      DB_PATH: /data/vkurilke.db
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_data:
  caddy_data:
  caddy_config:
